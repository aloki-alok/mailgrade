version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mailgrade
    main: .
    binary: mailgrade
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/aloki-alok/mailgrade/internal/cli.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: mailgrade
    name_template: "mailgrade_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: aloki-alok
    name: mailgrade

changelog:
  use: github
